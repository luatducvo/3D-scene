# The one Compose file for the whole system; run it through `uv run main.py up` (see --help).
# Profiles: backend (postgres, scene-api, scene-worker), frontend, local-gpu (scene-compute).
name: scene

services:
  postgres:
    profiles: [backend]
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scene}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scene}
      POSTGRES_DB: ${POSTGRES_DB:-scene}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scene}"]
      interval: 5s
      retries: 10

  scene-api:
    profiles: [backend]
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        PACKAGE: scene-api
    command: ["uvicorn", "scene_api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - backend/.env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - scene-data:/data
      - ./backend/config:/app/backend/config:ro
    depends_on:
      postgres:
        condition: service_healthy

  scene-worker:
    profiles: [backend]
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        PACKAGE: scene-worker
        SYSTEM_PACKAGES: ffmpeg
    command: ["python", "-m", "scene_worker.main"]
    env_file:
      - backend/.env
    volumes:
      - scene-data:/data
      - ./backend/config:/app/backend/config:ro
    depends_on:
      postgres:
        condition: service_healthy

  scene-compute:
    profiles: [local-gpu]
    build:
      context: .
      dockerfile: Dockerfile.compute
      args:
        EXTRAS: "${LOCAL_GPU_EXTRAS:-}"
    env_file:
      - backend/.env
    environment:
      PORT: "9000"
      COMPUTE_TOKEN: ""              # private network, no token needed locally
      DATA_DIR: /data/target         # its Target Workspaces, apart from published results in /data/scenes
    expose:
      - "9000"
    volumes:
      - scene-data:/data
      - ${HOST_MODELS_DIR:-./backend/models}:/models
      - ./backend/config:/app/backend/config:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # No depends_on, so the frontend profile runs alone; it reaches scene-api only per request.
  frontend:
    profiles: [frontend]
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
        VITE_API_MODE: ${VITE_API_MODE:-http}
    env_file:
      - frontend/.env
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  scene-data:        # uploads, stage outputs, Compute Run records; removed by `reset`
  postgres-data:     # database; removed by `reset`

networks:
  default:
    name: scene-net
