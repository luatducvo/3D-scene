# Run through `uv run tasks.py up` (passes --env-file backend/.env). Build context is the repository root.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      retries: 10

  scene-api:
    build:
      context: ..
      dockerfile: backend/docker/python.Dockerfile
      args: { PACKAGE: scene-api }
    command: ["uvicorn", "scene_api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env
    ports: ["127.0.0.1:8000:8000"]
    volumes:
      - scene-data:/data
      - ./config:/app/backend/config:ro
    depends_on:
      postgres: { condition: service_healthy }

  scene-worker:
    build:
      context: ..
      dockerfile: backend/docker/python.Dockerfile
      args: { PACKAGE: scene-worker, SYSTEM_PACKAGES: ffmpeg }
    command: ["python", "-m", "scene_worker.main"]
    env_file: .env
    volumes:
      - scene-data:/data
      - ./config:/app/backend/config:ro
    depends_on:
      postgres: { condition: service_healthy }

  scene-compute:
    profiles: ["local-gpu"]
    build:
      context: ..
      dockerfile: backend/docker/compute.Dockerfile
      args: { EXTRAS: "${LOCAL_GPU_EXTRAS:-}" }
    env_file: .env
    environment:
      PORT: "9000"
      COMPUTE_TOKEN: ""              # private network, no token needed locally
      DATA_DIR: /data/target         # its Target Workspaces, apart from published results in /data/scenes
    expose: ["9000"]
    volumes:
      - scene-data:/data
      - ${HOST_MODELS_DIR:-./models}:/models
      - ./config:/app/backend/config:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  scene-data:        # uploads, stage outputs, Compute Run records; removed by `reset`
  postgres-data:     # database; removed by `reset`

networks:
  default:
    name: scene-net
