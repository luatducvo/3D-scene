[project]
name = "scene-compute"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["scene-core", "scene-stages", "fastapi>=0.115", "uvicorn>=0.34", "httpx>=0.28"]

[project.optional-dependencies]
# Every GPU Algorithm ships in one image (docs/ADR-0002-single-gpu-image-ultralytics-sam3.md).
gpu = ["scene-stages[recon-mapanything,align-geocalib,segment-sam3,embed-metaclip2]"]

[tool.uv.sources]
scene-core = { workspace = true }
scene-stages = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
