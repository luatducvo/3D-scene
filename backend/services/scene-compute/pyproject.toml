[project]
name = "scene-compute"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["scene-core", "scene-stages", "fastapi>=0.115", "uvicorn>=0.34", "httpx>=0.28"]

[project.optional-dependencies]
# MapAnything needs numpy>=2 and SAM 3 needs numpy<2, so GPU algorithms ship as two image variants.
recon = ["scene-stages[recon-mapanything,align-geocalib]"]
perception = ["scene-stages[segment-sam3,embed-metaclip2]"]

[tool.uv.sources]
scene-core = { workspace = true }
scene-stages = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
