# Requires real adapters and their optional dependencies; use pipeline.fake.yaml for the skeleton.
# Every Stage runs on GPU_TARGET, the compute Target running the single GPU image;
# set it in backend/.env.
# No provider is the default.
target: "${GPU_TARGET}"
stages:
  ingest:
    # long_side must equal UPLOAD_LONG_SIDE in frontend/src/lib/upload/shrink.ts.
    algorithm: ingest.opencv
    params: {min_keyframes: 10, max_keyframes: 200, video_fps: 3, quality_filter: false, blur_threshold: 100.0, phash_distance: 6, long_side: 1600}
  recon:
    algorithm: recon.da3
    params: {model_id: depth-anything/DA3NESTED-GIANT-LARGE-1.1, process_res: 504, use_ray_pose: true, ref_view_strategy: saddle_balanced, confidence_percentile: 10}
  align:
    algorithm: align.geocalib_ransac
    params: {ransac_threshold_m: 0.02, num_calibration_frames: 20}
  mesh:
    algorithm: mesh.tsdf
    params: {voxel_size_m: 0.02, sdf_trunc_m: 0.05, bounds_percentile: 1, points_confidence_percentile: 40, points_edge_threshold: 0.05, points_voxel_m: 0.01, max_points: 3000000, device: cuda, chunk_voxels: 8000000}
  segment:
    algorithm: segment.sam3
    params: {vocabulary_file: indoor-en.txt, score_threshold: 0.5, frame_stride: 1, half: true, prompt_batch_size: 128, containment_threshold: 0.8}
  lift:
    algorithm: lift.maskclustering
    params: {min_views: 2, num_best_views: 3, merge_overlap: 0.5, device: cuda}
  objects:
    algorithm: objects.geometric
    # membership_radius_m: a point or mesh vertex within it of an Object's lift points belongs to it.
    params: {membership_radius_m: 0.02}
  embed:
    algorithm: embed.mg3d_doc
    # A VLM writes each Object's Description from its Best Views, label and placement facts; the
    # embedder embeds it and Search queries; the reranker judges Descriptions against queries.
    # support_gap_m, support_overlap, wall_distance_m, num_neighbours: the placement fact thresholds.
    params: {vlm_model_id: Qwen/Qwen3-VL-8B-Instruct, embedder_model_id: BAAI/bge-m3, reranker_model_id: BAAI/bge-reranker-v2-m3, vlm_batch_size: 8, embed_batch_size: 32, max_views: 3, max_new_tokens: 256, support_gap_m: 0.05, support_overlap: 0.5, wall_distance_m: 0.3, num_neighbours: 2}
