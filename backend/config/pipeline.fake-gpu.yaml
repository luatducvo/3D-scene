# Exercises remote transport without downloading model weights.
# GPU_TARGET names the compute Target that receives every Stage; no provider is the default.
target: "${GPU_TARGET}"
stages:
  ingest: {algorithm: ingest.fake}
  recon: {algorithm: recon.fake}
  align: {algorithm: align.fake}
  mesh: {algorithm: mesh.fake}
  segment: {algorithm: segment.fake}
  lift: {algorithm: lift.fake}
  embed: {algorithm: embed.fake}
  objects: {algorithm: objects.fake}
